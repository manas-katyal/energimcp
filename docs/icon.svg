<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EnergiMCP">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4f7cff"/>
      <stop offset="0.38" stop-color="#8b5cf6"/>
      <stop offset="0.72" stop-color="#22c1dc"/>
      <stop offset="1"    stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1026" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#chip)"/>
  <rect width="512" height="512" rx="114" fill="url(#gloss)"/>
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6"/>

  <g fill="url(#letter)" filter="url(#soft)">
    <rect x="150" y="128" width="58"  height="256" rx="16"/>
    <rect x="150" y="128" width="212" height="58"  rx="16"/>
    <rect x="150" y="227" width="178" height="58"  rx="16"/>
    <rect x="150" y="326" width="212" height="58"  rx="16"/>
  </g>
</svg>
